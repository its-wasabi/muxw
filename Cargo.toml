[package]
name = "muxw"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.0"

authors = ["Mikołaj Kozłowski <kozlowski.g.mikolaj@gmail.com>"]
license-file = "LICENSE"
repository = "https://github.com/Fasamii/muxw"
description = "Hyperextensible Wayland compositor"

[dependencies]
eyre = "0.6.14"
backtrace = "0.3.77"
tracing = { version = "0.1.44", features = ["max_level_trace", "release_max_level_warn"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }

evl = "0.1.0"

clap = { version = "4.5.54", features = ["derive"] }

wayland-server = { version = "0.31.10", default-features = false }
wayland-protocols = { version = "0.32.9", features = ["server", "staging"] }

rustix = "1.1.4"
bitflags = "2.11.0"
rustc-hash = "2.1.2"
slotmap = "1.1.1"
multi_index_map = "0.15.1"
crossbeam-channel = "0.5.15"

libseat-sys = "0.2.0"
udev = "0.9.3"
input = "0.10.0"
xkbcommon = "0.9.0"

drm = "0.15.0"
ash = "0.38.0"

mlua = { version = "0.11.5", default-features = false, features = [
	"luajit52",
	"vendored",
	"serialize",
] }


# TODO: Remove evdev since xkbcommon already handles things evdev would do
# (You have to write xkb module first and more logical kb handling)
evdev = "0.13.2"

[build-dependencies]
clap_complete = "4.5.65"
clap = { version = "4.5.54", features = ["derive"] }
